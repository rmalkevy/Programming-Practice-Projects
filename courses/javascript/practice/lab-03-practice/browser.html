<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 03: браузерні експерименти</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    button { font: inherit; margin: 0 .5rem .5rem 0; padding: .4rem .8rem; cursor: pointer; }
    pre { background: #f3f3f3; padding: .8rem; min-height: 8rem; white-space: pre-wrap; border-radius: 6px; }

<body>

    Для кнопок fetch запусти в терміналі <code>node mock-server.js</code>.
    Усе, що друкується тут, також іде в консоль (F12).
  </p>

  <button id="fetch404">fetch 404 і мережева помилка</button>
  <button id="unhandled">reject без catch</button>
  <button id="order">порядок: sync, мікрозадача, таймер, rAF</button>

  <script src="browser.js"></script>
